<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<title>CCU Campus – Search</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; }
  .card { border: 1px solid #ddd; padding: 1rem; border-radius: 12px; max-width: 640px; }
  .flag { margin-top: .75rem; font-size: .9rem; color: #0a7; display:none; }
  code { background: #f6f8fa; padding: 0 .25rem; border-radius: 4px; }
</style>
<div class="card">
  <h1>Campus Market</h1>
  <p>Try searching for a deal: <code>?q=coffee</code></p>
  <div id="results"></div>
  <div id="flag" class="flag">FLAG{hello_xss}</div>
  <p style="margin-top:1rem; font-size:.9rem;color:#555;">
    Tip: change the URL to include <code>?q=...</code>
  </p>
</div>
<script>
  // Vulnerable code: directly injects unsanitized query into innerHTML
  const params = new URLSearchParams(location.search);
  const q = params.get('q') || '';
  const results = document.getElementById('results');

  // This makes <script> tags execute
  results.innerHTML = `<p>Search results for: <b>${q}</b></p>`;

  // Reveal flag after detecting script injection
  if (q.toLowerCase().includes('<script>')) {
    document.getElementById('flag').style.display = 'block';
  }
</script>
</html>
